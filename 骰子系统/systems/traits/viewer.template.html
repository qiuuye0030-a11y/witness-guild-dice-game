<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>魂性谱 · 武魂特性编目</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#243129;background:#f3f2eb}*{box-sizing:border-box}body{margin:0}header{padding:30px max(20px,calc((100vw - 1300px)/2));background:#203d36;color:#f4f0de}h1{font-size:29px;margin:0 0 9px;letter-spacing:.12em}header p{margin:5px 0;line-height:1.8;color:#d7e4d8}.badge{display:inline-block;padding:4px 10px;background:#e7c973;color:#29382c;border-radius:20px;font-size:12px}main{max-width:1340px;padding:22px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:white;border:1px solid #d7dfd4;border-radius:10px;padding:13px 18px;flex:1;min-width:125px}.stat strong{display:block;font-size:26px;color:#305b49}.stat span{font-size:13px;color:#627164}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,button{font:inherit;border:1px solid #b8c7b9;border-radius:7px;padding:10px;background:white;color:inherit}input{flex:1;min-width:210px}button{cursor:pointer}button:hover{background:#eaf0e5}.layout{display:grid;grid-template-columns:minmax(280px, .85fr) minmax(400px,1.5fr);gap:18px}.panel{background:white;border:1px solid #d7dfd4;border-radius:12px;overflow:hidden}.results{max-height:690px;overflow:auto}.row{display:block;width:100%;border:0;border-bottom:1px solid #e6ebe2;border-radius:0;text-align:left;padding:14px 17px}.row.selected{background:#e8f0e3;border-left:4px solid #587a4b}.row b{display:block;font-size:14px;line-height:1.7}.row small{display:block;color:#6c796b;margin-top:4px}.pager{display:flex;align-items:center;justify-content:space-between;padding:13px;gap:8px;font-size:13px}.detail{padding:24px;line-height:1.9;overflow-wrap:anywhere}h2{font-size:23px;margin:0 0 10px}h3{font-size:16px;color:#3d654b;margin:23px 0 8px}.meta{color:#687669;font-size:13px}.notice{background:#f8f2df;border-left:3px solid #b78c34;padding:11px 14px;font-size:13px;margin-top:16px}ul{padding-left:22px}li{margin:6px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{background:#edf2e9;border-radius:5px;padding:3px 9px;font-size:12px}details{margin-top:17px}pre{background:#f3f5ef;padding:13px;overflow:auto;font-size:12px;line-height:1.6}#summary{padding:13px 17px;background:#f8faf5;color:#687669;font-size:13px}.empty{padding:25px;color:#6c796b}.route{border-bottom:1px solid #e6ebe2;padding:9px 0}.route b{color:#365b41}footer{font-size:12px;color:#6c796b;margin:16px 0;line-height:1.8}@media(max-width:800px){.layout{grid-template-columns:1fr}.results{max-height:340px}.detail{padding:18px}main{padding:14px}.stats{gap:8px}.stat{padding:10px;min-width:110px}.stat strong{font-size:22px}header{padding:24px 18px}h2{font-size:20px}}
</style></head><body>
<header><h1>魂性谱 <span class="badge">v11 · 属性关键词命名</span></h1><p>特性跟随玩家正常选择自动发挥，无需另选培养分支。</p><p>v11已通过战斗与成长适配器接入主游戏；独立结算接口仍可复用。</p></header>
<main><div class="stats" id="stats"></div><div class="filters"><input id="query" aria-label="搜索" placeholder="搜索武魂名、ID、特性名或描述"><select id="attribute" aria-label="属性"><option value="">全部来源属性</option></select><select id="kind" aria-label="类别"><option value="">全部类别</option><option value="battle">战斗类</option><option value="growth">成长类</option></select><select id="scope" aria-label="来源"><option value="">全部武魂</option><option value="catalog">可觉醒武魂</option><option value="member">会员与会长</option></select></div>
<div class="layout"><section class="panel"><div id="summary" aria-live="polite"></div><div id="results" class="results"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section><section class="panel detail" id="detail" aria-live="polite"></section></div>
<footer>每个武魂只保留一个机制关键词。训练和魂技效果按玩家本次实际选择自动匹配。数值预算、自动触发与保存恢复已接入；实际配对验算和适用范围见v11数值报告。</footer></main>
<script>
/*__PAYLOAD__*/
const $=id=>document.getElementById(id),size=40;let page=0,selected=null,filtered=[];
const text=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el;};
const byId=new Map(payload.items.map(t=>[t.soulId,t]));
const familyById=new Map();for(const g of payload.report.similarFamilies)for(const id of g.soulIds)familyById.set(id,g.soulIds);
for(const [n,label] of [[payload.items.length,'已绑定武魂ID'],[payload.report.duplicateNames.length,'名称重复组'],[payload.report.duplicateMechanics.length,'严格机制重复组'],[payload.report.similarFamilies.length,'待审阅相近家族']]){const s=text('div','','stat');s.append(text('strong',n),text('span',label));$('stats').append(s);}
for(const a of [...new Set(payload.items.flatMap(t=>t.sourceAttributes))].sort()){const o=document.createElement('option');o.value=a;o.textContent=a;$('attribute').append(o);}
function detail(t){
  selected=t.soulId;const el=$('detail');el.replaceChildren();el.append(text('h2',t.name),text('div',t.soulId+(t.owner?' · '+t.owner:''),'meta'));
  const chips=text('div','','chips');for(const value of [t.category,t.primaryAttribute+'／'+t.keyword,'武魂潜力'+t.tier+'档','自动匹配选择',t.activation==='mundane'?'普通物性与技法':'超凡机制'])chips.append(text('span',value,'chip'));el.append(chips);
  el.append(text('h3','被动设计'),text('p',t.description));
  if(t.secondaryAttributes.length)el.append(text('p','复合表现：'+t.secondaryAttributes.join('／')+'参与载体与外观，不再生成第二套特性机制。','meta'));
  el.append(text('h3','自动作用于后续选择'));
  for(const r of t.autoEffects){const d=text('div','','route');d.append(text('b',r.when+' · '),document.createTextNode(r.effect));el.append(d);}
  el.append(text('h3','原武魂依据'),text('p',t.soulExpression));
  const family=familyById.get(t.soulId)||[];el.append(text('h3','查重与近似审阅'),text('p','名称与严格机制已通过全库检查。'+(family.length?'另有'+(family.length-1)+'条共享触发、兑现和收益组，条件或失效方式不同。':'没有共享同一粗粒度机制家族的条目。')));
  if(family.length){const box=text('div','','chips');for(const id of family.filter(id=>id!==t.soulId).slice(0,6)){const other=byId.get(id),b=text('button',other.soulName);b.onclick=()=>detail(other);box.append(b);}el.append(box);}
  el.append(text('div','已按武魂潜力配置数值、触发间隔和收益上限。选择训练肉体，收益就作用于这次肉体训练；选择攻击魂技，就自动匹配攻击效果。v11主游戏已自动接入，无需额外选择分支。','notice'));
  const d=document.createElement('details');d.append(text('summary','查看抽取过程与数值预算'),text('pre',JSON.stringify({抽取:t.provenance,机制:t.spec,数值:t.balance,限制:t.limits},null,2)));el.append(d);
}
function draw(){const q=$('query').value.trim(),a=$('attribute').value,k=$('kind').value,s=$('scope').value;filtered=payload.items.filter(t=>(!a||t.sourceAttributes.includes(a))&&(!k||t.kind===k)&&(!s||t.bindingScope===s)&&(!q||[t.soulId,t.soulName,t.name,t.description,t.owner||''].some(x=>x.includes(q))));const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('summary').textContent='共 '+filtered.length+' 条 · 名称与机制分别检查';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page+1>=pages;const rows=$('results');rows.replaceChildren();for(const t of filtered.slice(page*size,(page+1)*size)){const b=text('button','','row'+(t.soulId===selected?' selected':''));b.append(text('b',t.name),text('small',t.soulId+' · '+t.category+' · '+t.primaryAttribute));b.onclick=()=>{detail(t);draw();};rows.append(b);}if(!filtered.length)rows.append(text('div','没有匹配结果。','empty'));if(!selected&&filtered.length)detail(filtered[0]);}
for(const id of ['query','attribute','kind','scope'])$(id).addEventListener(id==='query'?'input':'change',()=>{page=0;draw();});$('prev').onclick=()=>{page--;draw();};$('next').onclick=()=>{page++;draw();};draw();
</script></body></html>
