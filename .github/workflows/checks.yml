name: Build and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the trait catalog from the source catalog
        working-directory: 骰子系统
        run: node systems/traits/build.cjs
      # The regression suites read the generated engine bundles and themes.
      - name: Build both standalone themes
        working-directory: 骰子系统
        run: python -X utf8 _full_package.py
      - name: Twelve regression suites for trait cards, saves, growth and naming
        working-directory: 骰子系统
        run: node tools/check-v11.cjs
      - name: Verify the share archive and write both release ZIPs
        working-directory: 骰子系统
        run: python -X utf8 tools/package-v11.py
