name: Build and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both standalone themes
        working-directory: 骰子系统
        run: python -X utf8 _build_v12.py
      # Both checks read the generated themes and the build manifest under
      # v12.05.03版双前端分享/资料与校验/.
      - name: Verify the packaged themes and build manifest
        working-directory: 骰子系统
        run: node tools/verify-v12-package.cjs
      - name: Release regressions (17 suites incl. the 188-check module package)
        working-directory: 骰子系统
        run: python -X utf8 tools/verify-v12-release.py
